[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mytotalconnectcomfort"
version = "0.1.0"
description = "Python client library for the International Honeywell Evohome API (MyTotalConnectComfort) provided by Resideo"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Divya van Mahajan", email = "divya.vanmahajan@icloud.com"}
]
keywords = ["honeywell", "evohome", "heating", "thermostat", "api", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "mypy>=0.990",
    "flake8>=5.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/divyavanmahajan/mytotalconnectcomfort"
Documentation = "https://github.com/divyavanmahajan/mytotalconnectcomfort#readme"
Repository = "https://github.com/divyavanmahajan/mytotalconnectcomfort"
Issues = "https://github.com/divyavanmahajan/mytotalconnectcomfort/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mytotalconnectcomfort*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
