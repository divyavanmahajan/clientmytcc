[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evohome_py"
version = "0.2.2"
description = "Python client library for the International Honeywell Evohome API (MyTotalConnectComfort) provided by Resideo"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Divya van Mahajan", email = "divyavanmahajan@users.noreply.github.com"}
]
keywords = ["honeywell", "evohome", "heating", "thermostat", "api", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.scripts]
evohome = "evohome_py.cli:cli"
evohome_py = "evohome_py.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "mypy>=0.990",
    "flake8>=5.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/divyavanmahajan/mytotalconnectcomfort"
Documentation = "https://github.com/divyavanmahajan/mytotalconnectcomfort#readme"
Repository = "https://github.com/divyavanmahajan/mytotalconnectcomfort"
Issues = "https://github.com/divyavanmahajan/mytotalconnectcomfort/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["evohome_py*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
