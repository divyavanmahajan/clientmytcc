[package]
name = "evohome_rs"
version = "0.2.1"
edition = "2021"
authors = ["Divya van Mahajan <divyavanmahajan@users.noreply.github.com>"]
description = "Async Rust client for the International Honeywell Evohome API (MyTotalConnectComfort) provided by Resideo"
license = "MIT"
repository = "https://github.com/divyavanmahajan/clientmytcc"
documentation = "https://docs.rs/evohome_rs"
homepage = "https://github.com/divyavanmahajan/clientmytcc/blob/main/rust/README.md"
keywords = ["honeywell", "evohome", "heating", "api", "async"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
rust-version = "1.70"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
tabled = "0.15"
colored = "2.1"
rpassword = "7.3"
dirs = "5.0"
keyring = "2.3.3"
toml = "0.9.6"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
anyhow = "1.0"

[lib]
name = "evohome_rs"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "async_example"
path = "examples/async_example.rs"

[[bin]]
name = "evohome_rs"
path = "src/bin/evohome_rs.rs"
